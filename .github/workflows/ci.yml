name: CodeVerse Continuous Integration (CI)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint, Typecheck & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Code Quality Format Check
        run: pnpm prettier --check "**/*.{ts,tsx,js,jsx,json,css}" || true

      - name: Run Monorepo Build Pipeline
        run: pnpm build

  docker-check:
    name: Verify Docker Container Build Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Service Image Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: codeverse-api:test

      - name: Build Web Application Image Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: codeverse-web:test
