version: '3.8'

services:
  # 1. PostgreSQL Relational Database (Users, Projects, Settings)
  postgres:
    image: postgres:16-alpine
    container_name: codeverse-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeverse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codeverse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeverse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. MongoDB Document Store (Repository Metadata, Chat Memory, Telemetry)
  mongodb:
    image: mongo:7.0
    container_name: codeverse-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-codeverse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-codeverse_secret}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis In-Memory Cache & Event Queue
  redis:
    image: redis:7.2-alpine
    container_name: codeverse-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-codeverse_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-codeverse_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Qdrant Vector Store (RAG Embeddings & Semantic Code Search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeverse-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 5. NestJS API Backend Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codeverse-api
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeverse}:${POSTGRES_PASSWORD:-codeverse_secret}@postgres:5432/${POSTGRES_DB:-codeverse_db}?schema=public
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-codeverse}:${MONGO_INITDB_ROOT_PASSWORD:-codeverse_secret}@mongodb:27017/codeverse_mongo?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-codeverse_secret}@redis:6379
      QDRANT_URL: http://qdrant:6333
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 6. Next.js 3D Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: codeverse-web
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  qdrant_data:
